services:
  # Backend API Service
  - type: web
    name: bedtime-story-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5001
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: bedtime-story-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: BACKEND_URL
        value: https://bedtime-story-backend.onrender.com
